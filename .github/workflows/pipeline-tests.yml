name: pipeline tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -1
          git --version
          jq --version
          awk --version 2>/dev/null | head -1 || awk -W version 2>/dev/null | head -1 || true
      - name: Script tests
        run: bash tests/pipeline/test-scripts.sh
      - name: Hook tests
        run: bash tests/pipeline/test-hooks.sh
